{% extends "base.html" %}
{% block title %}{% if item %}Editar{% else %}Novo{% endif %} Modem - Inventarium{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-bold text-[#182387]"><i class="fas fa-broadcast-tower mr-2 text-[#182387]"></i>{% if item %}Editar{% else %}Novo{% endif %} Modem</h1>
</div>

<div class="bg-white rounded-xl shadow-sm p-6">
    <form action="{{ request.path }}" method="POST">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Código Interno *</label>
                <input type="text" name="codigo_interno" maxlength="50" required value="{{ item.codigo_interno if item else proximo_codigo }}" readonly class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Marca *</label>
                <select name="marca" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['ASUS', 'Aquário', 'D-Link', 'Elsys', 'Huawei', 'Intelbras', 'Mercusys', 'Netgear', 'TP-Link', 'Outra marca'] %}
                    <option value="{{ opt }}" {% if item and item.marca == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Host *</label>
                <input type="text" name="host" maxlength="150" required value="{{ item.host if item else '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Operadora *</label>
                <select name="operadora" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['Claro', 'Vivo', 'Nio', 'Oi', 'Brisanet', 'Brasil TecPar', 'Giga Mais Fibra', 'Vero', 'Starlink Brazil', 'Desktop', 'TIM', 'Unifique', 'Algar Telecom', 'Alares', 'Kore Brasil', 'Ligga', 'R7 Telecomunicações', 'Sea Telecom', 'Linq Telecom', 'ATEL Telecom', 'Outra operadora'] %}
                    <option value="{{ opt }}" {% if item and item.operadora == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Velocidade da Rede *</label>
                <select name="velocidade_rede" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['Até 100 Mbps', 'de 100 Mbps até 200 Mbps', 'de 200 Mbps até 350 Mbps', 'de 350 Mbps até 500 Mbps', 'de 500 Mbps até 800 Mbps', 'de 800 Mbps até 1 Gbps', 'Acima de 1 Gbps'] %}
                    <option value="{{ opt }}" {% if item and item.velocidade_rede == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Empresa</label>
                <select name="empresa_id" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for e in empresas %}
                    <option value="{{ e.id }}" {% if item and item.empresa_id == e.id %}selected{% endif %}>{{ e.nome_fantasia }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Local de Uso</label>
                <select name="local_de_uso_id" data-selecionado="{{ item.area_local_id if item and item.area_local_id else '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                </select>
            </div>
        </div>
        <div class="mt-6 flex gap-4">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg"><i class="fas fa-save mr-2"></i>Salvar</button>
            <a href="{{ url_for('list_modems') }}" class="bg-red-800 hover:bg-red-900 text-white px-6 py-2 rounded-lg"><i class="fas fa-times mr-2"></i>Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
