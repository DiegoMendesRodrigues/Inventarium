{% extends "base.html" %}
{% block title %}{% if item %}Editar{% else %}Novo{% endif %} Periférico - Inventarium{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-[#182387] mb-6"><i class="fas fa-keyboard mr-2 text-[#182387]"></i>{% if item %}Editar{% else %}Novo{% endif %} Periférico</h1>

<div class="bg-white rounded-xl shadow-sm p-6">
    <form method="POST" action="{{ request.path }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Código Interno *</label>
                <input type="text" name="codigo_interno" maxlength="50" required value="{{ item.codigo_interno if item else proximo_codigo }}" readonly class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Descrição *</label>
                <input type="text" name="descricao" maxlength="100" required value="{{ item.descricao if item else '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Periférico *</label>
                <select name="perifericos_multimidia" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    {{ lista_informacao(perifericos_computador, item.perifericos_multimidia if item else '', ['Outro']) }}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Marca *</label>
                <select name="marca" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    {{ lista_informacao(marcas, item.marca if item else '', ['Outra']) }}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Empresa *</label>
                <select name="empresa_id" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for e in empresas %}
                    <option value="{{ e.id }}" {% if item and item.empresa_id == e.id %}selected{% endif %}>{{ e.nome_fantasia }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Local de Uso</label>
                <select name="local_de_uso_id" data-selecionado="{{ item.area_local_id if item and item.area_local_id else '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Estação de Trabalho, All-in-One ou Notebook</label>
                <select name="codigo_equipamento" data-selecionado="{{ item.codigo_equipamento if item and item.codigo_equipamento else '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    <option value="Outra">Outra</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                <select name="usuario_id" data-selecionado="{{ item.usuario_id if item and item.usuario_id else '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Outras Informações</label>
                <textarea name="outras_informacoes" rows="3"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">{% if item %}{{ item.outras_informacoes }}{% endif %}</textarea>
            </div>
        </div>
        <div class="mt-6 flex gap-4">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg"><i class="fas fa-save mr-2"></i>Salvar</button>
            <a href="{{ url_for('list_perifericos') }}" class="bg-red-800 hover:bg-red-900 text-white px-6 py-2 rounded-lg"><i class="fas fa-times mr-2"></i>Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
