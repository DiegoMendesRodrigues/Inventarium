<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ajuda - Inventarium{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#f3f4f6] min-h-screen px-4 py-8 sm:px-6">
    <main class="mx-auto max-w-5xl">
        <header class="mb-8 text-center">
            <div class="mb-3 flex items-center justify-center gap-3 text-[#182387]">
                <i class="fas fa-server text-3xl"></i>
                <span class="text-3xl font-bold">Inventarium</span>
            </div>
        </header>
        {% block content %}{% endblock %}
        <div class="mt-8 text-center">
            <a href="{{ url_for('autenticar') }}" class="inline-flex items-center rounded-lg bg-[#182387] px-6 py-3 font-medium text-white hover:bg-[#0f1a66]">
                <i class="fas fa-arrow-left mr-2"></i>Voltar para a Autenticação
            </a>
        </div>
    </main>
</body>
</html>
