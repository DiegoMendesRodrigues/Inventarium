{% extends "base.html" %}
{% block title %}{% if item %}Editar{% else %}Novo{% endif %} Projetor - Inventarium{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-[#182387] mb-6"><i class="fas fa-video mr-2 text-[#182387]"></i>{% if item %}Editar{% else %}Novo{% endif %} Projetor</h1>

<div class="bg-white rounded-xl shadow-sm p-6">
    <form method="POST" action="{{ request.path }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Código Interno *</label>
                <input type="text" name="codigo_interno" maxlength="50" value="{{ item.codigo_interno if item else proximo_codigo }}" readonly required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Marca *</label>
                <select name="marca" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['Epson', 'BenQ', 'Samsung', 'LG', 'Hisense', 'JMGO', 'Optoma', 'Sony', 'Panasonic', 'Intelbras', 'Multi', 'Outra'] %}
                    <option value="{{ opt }}" {% if item and item.marca == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tecnologia de Imagem *</label>
                <select name="tecnologia_imagem" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['DLP (Digital Light Processing)', 'LCD/3LCD', 'LED', 'Laser', 'Outro'] %}
                    <option value="{{ opt }}" {% if item and item.tecnologia_imagem == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tipo *</label>
                <select name="tipo" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['Home Theater', 'Corporativo', 'Portátil', 'Curta ou Ultra-Curta Distância', 'Outro'] %}
                    <option value="{{ opt }}" {% if item and item.tipo == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Resolução *</label>
                <select name="resolucao" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['SVGA (800x600)', 'XGA (1024x768)', 'WXGA (1280x800)', 'HD (1280x720/720p)', 'Full HD (1920x1080/1080p)', 'WUXGA (1920x1200)', '4K UHD (3840x2160)', '4K Nativo (4096x2160)', 'Outra'] %}
                    <option value="{{ opt }}" {% if item and item.resolucao == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Conectividade *</label>
                <select name="conectividade" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['HDMI', 'USB', 'Wi-Fi', 'Bluetooth', 'Outra'] %}
                    <option value="{{ opt }}" {% if item and item.conectividade == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Empresa *</label>
                <select name="empresa_id" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for e in empresas %}
                    <option value="{{ e.id }}" {% if item and item.empresa_id == e.id %}selected{% endif %}>{{ e.nome_fantasia }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Local de Uso *</label>
                <select name="local_de_uso_id" required data-selecionado="{{ item.area_local_id if item and item.area_local_id else '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Outras Informações</label>
                <textarea name="outras_informacoes" rows="3"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">{% if item %}{{ item.outras_informacoes }}{% endif %}</textarea>
            </div>
        </div>
        <div class="mt-6 flex gap-4">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>Salvar
            </button>
            <a href="{{ url_for('list_projetores') }}" class="bg-red-800 hover:bg-red-900 text-white px-6 py-2 rounded-lg">
                <i class="fas fa-times mr-2"></i>Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
