{% extends "base.html" %}
{% block title %}{% if item %}Editar{% else %}Novo{% endif %} - {{ configuracao.rotulo }} - Inventarium{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-bold text-[#182387]"><i class="fas fa-list mr-2 text-[#182387]"></i>{% if item %}Editar{% else %}Novo{% endif %} - {{ configuracao.rotulo }}</h1>
</div>

<div class="bg-white rounded-xl shadow-sm p-6">
    <form method="POST" action="{{ request.path }}">
        {% if item %}
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Código</label>
            <input type="text" value="{{ item.codigo }}" disabled class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50">
        </div>
        {% endif %}
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-1">Nome *</label>
            <input type="text" name="nome" value="{{ item.nome if item else '' }}" maxlength="100" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg">
                <i class="fas fa-check mr-2"></i>Salvar
            </button>
            <a href="{{ url_for('list_configuracao_referencia', tabela=configuracao.tabela) }}" class="bg-red-800 hover:bg-red-900 text-white px-6 py-2 rounded-lg">
                <i class="fas fa-times mr-2"></i>Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
