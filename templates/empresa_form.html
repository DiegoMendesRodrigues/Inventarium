<!-- Sistema criado por Diego Mendes Rodrigues, utilizando desenvolvimento de software e inteligência artificial -->
{% extends "base.html" %}
{% block title %}{% if item %}Editar{% else %}Nova{% endif %} Empresa - Inventarium{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-[#182387] mb-6"><i class="fas fa-building mr-2 text-[#182387]"></i>{% if item %}Editar{% else %}Nova{% endif %} Empresa</h1>

<div class="bg-white rounded-xl shadow-sm p-6">
    <form method="POST" action="{{ request.path }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">CNPJ *</label>
                <input type="text" name="cnpj" maxlength="18" value="{{ item.cnpj if item else '' }}" placeholder="00.000.000/0000-00" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Razão Social *</label>
                <input type="text" name="razao_social" maxlength="150" value="{{ item.razao_social if item else '' }}" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Nome Fantasia *</label>
                <input type="text" name="nome_fantasia" maxlength="150" value="{{ item.nome_fantasia if item else '' }}" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">CEP *</label>
                <input type="text" name="cep" maxlength="9" value="{{ item.cep if item else '' }}" placeholder="00000-000" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Logradouro *</label>
                <input type="text" name="logradouro" maxlength="150" value="{{ item.logradouro if item else '' }}" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Bairro *</label>
                <input type="text" name="bairro" maxlength="50" value="{{ item.bairro if item else '' }}" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Cidade *</label>
                <input type="text" name="cidade" maxlength="50" value="{{ item.cidade if item else '' }}" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Estado *</label>
                <select name="estado" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Selecione</option>
                    {% for opt in ['Acre (AC)', 'Alagoas (AL)', 'Amapá (AP)', 'Amazonas (AM)', 'Bahia (BA)', 'Ceará (CE)', 'Distrito Federal (DF)', 'Espírito Santo (ES)', 'Goiás (GO)', 'Maranhão (MA)', 'Mato Grosso (MT)', 'Mato Grosso do Sul (MS)', 'Minas Gerais (MG)', 'Pará (PA)', 'Paraíba (PB)', 'Paraná (PR)', 'Pernambuco (PE)', 'Piauí (PI)', 'Rio de Janeiro (RJ)', 'Rio Grande do Norte (RN)', 'Rio Grande do Sul (RS)', 'Rondônia (RO)', 'Roraima (RR)', 'Santa Catarina (SC)', 'São Paulo (SP)', 'Sergipe (SE)', 'Tocantins (TO)'] %}
                    <option value="{{ opt }}" {% if item and item.estado == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Telefone *</label>
                <input type="text" name="telefones" maxlength="50" value="{{ item.telefones if item else '' }}" placeholder="(00) 00000-00000" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">E-mail *</label>
                <input type="email" name="email" maxlength="50" value="{{ item.email if item else '' }}" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Outras Informações</label>
                <textarea name="outras_informacoes" rows="3"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">{% if item %}{{ item.outras_informacoes }}{% endif %}</textarea>
            </div>
        </div>
        <div class="mt-6 flex gap-4">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>Salvar
            </button>
            <a href="{{ url_for('list_empresas') }}" class="bg-red-800 hover:bg-red-900 text-white px-6 py-2 rounded-lg">
                <i class="fas fa-times mr-2"></i>Cancelar
            </a>
        </div>
    </form>
</div>

<script>
const campoCep = document.querySelector('input[name="cep"]');
const cepInicial = campoCep.value.replace(/\D/g, '');
campoCep.addEventListener('blur', function () {
    if (campoCep.value.length !== 9) return;
    const ceplimpo = campoCep.value.replace(/\D/g, '').slice(0, 8);
    if (ceplimpo.length !== 8) return;
    if (ceplimpo === cepInicial) return;
    fetch('https://viacep.com.br/ws/' + ceplimpo + '/json/')
        .then(function (resposta) { return resposta.json(); })
        .then(function (dados) {
            if (dados.erro) return;
            document.querySelector('input[name="logradouro"]').value = dados.logradouro || '';
            document.querySelector('input[name="bairro"]').value = dados.bairro || '';
            document.querySelector('input[name="cidade"]').value = dados.cidade || dados.localidade || '';
            const estado = (dados.estado || '') + ' (' + (dados.uf || '') + ')';
            const select = document.querySelector('select[name="estado"]');
            let encontrado = false;
            Array.from(select.options).forEach(function (opt) {
                if (opt.value === estado || (dados.uf && opt.value.endsWith('(' + dados.uf + ')'))) {
                    select.value = opt.value;
                    encontrado = true;
                }
            });
            if (!encontrado) select.value = estado;
        })
        .catch(function () {});
});
function validarCNPJ(cnpj) {
    cnpj = cnpj.replace(/\D/g, '');
    if (cnpj.length !== 14) return false;
    if (/^(\d)\1{13}$/.test(cnpj)) return false;
    const pesos1 = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
    const pesos2 = [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
    let soma = 0;
    for (let i = 0; i < 12; i++) soma += parseInt(cnpj[i]) * pesos1[i];
    const resto1 = soma % 11;
    const dv1 = resto1 < 2 ? 0 : 11 - resto1;
    if (dv1 !== parseInt(cnpj[12])) return false;
    soma = 0;
    for (let i = 0; i < 13; i++) soma += parseInt(cnpj[i]) * pesos2[i];
    const resto2 = soma % 11;
    const dv2 = resto2 < 2 ? 0 : 11 - resto2;
    return dv2 === parseInt(cnpj[13]);
}
const campoCnpj = document.querySelector('input[name="cnpj"]');
campoCnpj.addEventListener('blur', function () {
    if (!this.value.trim()) return;
    if (!validarCNPJ(this.value)) {
        alert('CNPJ inválido: os dígitos verificadores não conferem.');
        this.focus();
    }
});
</script>
{% endblock %}
